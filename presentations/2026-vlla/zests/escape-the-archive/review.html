<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review: Escape the Archive</title>
  <script src="/public/zest-bridge.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f1ea; color: #2d3b45; font-size: 14px; line-height: 1.45;
      overflow-y: auto;
    }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 14px 16px 24px; }
    .sample { display: none; background: #fff4d6; border: 1px solid #e3c678; color: #6b4e12; border-radius: 8px; padding: 7px 12px; font-size: 13px; margin-bottom: 10px; }
    .sample.visible { display: block; }
    .hero {
      background: linear-gradient(120deg, #1d150e, #3a2a1a); color: #f3e9d6; border-radius: 12px;
      padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 12px;
    }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-size: 20px; color: #f0c96b; }
    .hero .who { font-size: 13px; color: #cdbb9b; }
    .hero .score { margin-left: auto; text-align: right; }
    .hero .score b { font-family: Georgia, serif; font-size: 34px; color: #fff; }
    .hero .score span { color: #cdbb9b; }
    .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
    .tile { background: #fff; border-radius: 10px; padding: 9px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: #7a6a55; }
    .tile .v { font-size: 20px; font-weight: 700; color: #2d3b45; }
    .card { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card h2 { font-size: 15px; color: #0770A2; margin-bottom: 8px; }
    .tl svg { width: 100%; height: auto; display: block; }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #6b6b6b; margin-top: 4px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
    .locks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .lk { border: 1px solid #e6ddcf; border-radius: 10px; padding: 10px 12px; background: #fffdf9; }
    .lk.open { border-left: 5px solid #27ae60; }
    .lk.shut { border-left: 5px solid #c0392b; }
    .lk h3 { font-size: 14px; display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .lk h3 .pts { font-family: ui-monospace, Menlo, Consolas, monospace; color: #2d3b45; }
    .row { display: flex; gap: 6px; font-size: 13px; margin: 2px 0; }
    .row .k { color: #7a6a55; min-width: 92px; }
    .ok { color: #1e7e46; font-weight: 700; }
    .no { color: #b03a2e; font-weight: 700; }
    .tries { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .try { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; background: #fbe9e7; color: #8a2a20; border-radius: 5px; padding: 1px 6px; }
    .key { margin-top: 6px; font-size: 12.5px; background: #eef6fb; border-radius: 6px; padding: 5px 8px; color: #164a66; }
    .muted { color: #7a6a55; font-size: 12.5px; }
    @media (max-width: 700px) {
      .tiles { grid-template-columns: repeat(2, 1fr); }
      .locks { grid-template-columns: 1fr; }
      .hero .score { margin-left: 0; text-align: left; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="sample" id="sample">Sample submission (preview). Inside SpeedGrader this page shows the real student's work.</div>
  <div id="review-content"><p class="muted">Loading submission&hellip;</p></div>
</div>
<script>
(function() {
  'use strict';

  var SAMPLE = {
    score: 70, maxScore: 100, userName: 'Avery Student',
    submittedAt: '2026-10-01T15:42:00.000Z',
    comment: 'Escape the Archive: 3/4 locks, 70/100, 1 hint(s)',
    artifacts: {
      activity: 'escape-the-archive', version: '1.0.0',
      settings: { hints: true, timeLimitMinutes: 15, pointsPerLock: 25, hintCost: 5 },
      locks: [
        { id: 'l1', num: 1, name: 'The Year Dial', kind: 'digits', opened: true, entry: '1776', lastSetting: null,
          wrongTries: [{ value: '1863', at: 41000 }, { value: '1787', at: 78000 }], hintUsed: false, openedAtMs: 124000, activeMs: 118000, points: 25 },
        { id: 'l2', num: 2, name: 'The Word Lock', kind: 'letters', opened: true, entry: 'WELFARE', lastSetting: null,
          wrongTries: [{ value: 'DEFENCE', at: 201000 }], hintUsed: true, openedAtMs: 262000, activeMs: 131000, points: 20 },
        { id: 'l3', num: 3, name: 'The Insignia Lock', kind: 'choice', opened: true, entry: '101st Airborne Division', lastSetting: null,
          wrongTries: [{ value: 'Arkansas National Guard', at: 300000 }], hintUsed: false, openedAtMs: 334000, activeMs: 70000, points: 25 },
        { id: 'l4', num: 4, name: 'The Timeline Lock', kind: 'order', opened: false, entry: null, lastSetting: 'C,E,B,A,D',
          wrongTries: [{ value: 'E,C,A,B,D', at: 610000 }, { value: 'C,E,B,A,D', at: 802000 }], hintUsed: false, openedAtMs: null, activeMs: 566000, points: 0 }
      ],
      score: 70, maxScore: 100, locksOpened: 3, hintsUsed: 1, wrongTries: 6,
      elapsedMs: 900000, escaped: false, timedOut: true, completedAt: '2026-10-01T15:42:00.000Z'
    }
  };
  var SAMPLE_KEY = null; // the real key comes only from Zest.getAnswerKey() in SpeedGrader

  var EVENTS = {
    A: 'Gettysburg Address', B: '19th Amendment ratified', C: 'Declaration of Independence',
    D: 'Little Rock Nine escorted', E: 'Constitution signed'
  };

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s === null || s === undefined ? '' : String(s);
    return d.innerHTML;
  }
  function fmt(ms) {
    if (typeof ms !== 'number' || ms < 0) return '–';
    var s = Math.round(ms / 1000), m = Math.floor(s / 60);
    s = s % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function orderText(kind, v) {
    if (kind !== 'order' || typeof v !== 'string') return esc(v);
    var parts = v.split(','), out = [];
    for (var i = 0; i < parts.length; i++) out.push(esc(EVENTS[parts[i]] || parts[i]));
    return out.join(' → ');
  }

  function timeline(a) {
    var total = Math.max(a.elapsedMs || 0, 1000);
    var W = 900, H = 118, x0 = 120, x1 = 880;
    function X(ms) { return x0 + Math.min(1, Math.max(0, ms / total)) * (x1 - x0); }
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Timeline of tries per lock">';
    var locks = a.locks || [];
    for (var i = 0; i < locks.length; i++) {
      var L = locks[i], y = 16 + i * 24;
      svg += '<text x="0" y="' + (y + 4) + '" font-size="12" fill="#5a4a35">' + esc(L.num + '. ' + (L.name || '').replace('The ', '')) + '</text>';
      svg += '<line x1="' + x0 + '" y1="' + y + '" x2="' + x1 + '" y2="' + y + '" stroke="#e6ddcf" stroke-width="6" stroke-linecap="round"/>';
      var tries = L.wrongTries || [];
      for (var j = 0; j < tries.length; j++) {
        svg += '<circle cx="' + X(tries[j].at) + '" cy="' + y + '" r="5" fill="#c0392b"><title>Wrong: ' + esc(tries[j].value) + ' at ' + fmt(tries[j].at) + '</title></circle>';
      }
      if (L.opened && typeof L.openedAtMs === 'number') {
        svg += '<rect x="' + (X(L.openedAtMs) - 7) + '" y="' + (y - 7) + '" width="14" height="14" rx="3" fill="#27ae60"><title>Opened at ' + fmt(L.openedAtMs) + '</title></rect>';
        if (L.hintUsed) svg += '<text x="' + (X(L.openedAtMs) + 11) + '" y="' + (y + 4) + '" font-size="11" fill="#9a6a10">hint</text>';
      }
    }
    var yAxis = 16 + locks.length * 24 - 4;
    svg += '<line x1="' + x0 + '" y1="' + yAxis + '" x2="' + x1 + '" y2="' + yAxis + '" stroke="#bbb"/>';
    for (var t = 0; t <= 4; t++) {
      var ms = total * t / 4;
      svg += '<text x="' + X(ms) + '" y="' + (yAxis + 14) + '" font-size="11" text-anchor="middle" fill="#888">' + fmt(ms) + '</text>';
    }
    svg += '</svg>';
    return svg;
  }

  function render(sub, key) {
    var a = sub.artifacts || {};
    var locks = a.locks || [];
    var settings = a.settings || {};
    var h = '';
    var outcome = a.escaped ? 'Escaped: all four locks opened' : (a.timedOut ? 'Time ran out' : 'Left the archive early');
    h += '<div class="hero"><div><h1>Escape the Archive</h1><div class="who"><b>' + esc(sub.userName || 'Student') + '</b> · submitted ' +
      (sub.submittedAt ? esc(new Date(sub.submittedAt).toLocaleString()) : '–') + '</div><div class="who">' + esc(outcome) + '</div></div>' +
      '<div class="score"><b>' + esc(sub.score) + '</b> <span>/ ' + esc(sub.maxScore || 100) + '</span></div></div>';

    h += '<div class="tiles">' +
      '<div class="tile"><div class="k">Locks opened</div><div class="v">' + esc(a.locksOpened) + ' / 4</div></div>' +
      '<div class="tile"><div class="k">Wrong tries</div><div class="v">' + esc(a.wrongTries) + '</div></div>' +
      '<div class="tile"><div class="k">Hints used</div><div class="v">' + esc(a.hintsUsed) + (settings.hints === false ? ' <span class="muted">(off)</span>' : '') + '</div></div>' +
      '<div class="tile"><div class="k">Time taken</div><div class="v">' + fmt(a.elapsedMs) + '</div></div>' +
      '<div class="tile"><div class="k">Time limit</div><div class="v">' + (settings.timeLimitMinutes ? esc(settings.timeLimitMinutes) + ' min' : 'None') + '</div></div>' +
      '</div>';

    h += '<div class="card tl"><h2>Timeline</h2>' + timeline(a) +
      '<div class="legend"><span><i style="background:#c0392b"></i>wrong try</span><span><i style="background:#27ae60;border-radius:2px"></i>lock opened</span></div></div>';

    h += '<div class="card"><h2>Lock by lock</h2><div class="locks">';
    for (var i = 0; i < locks.length; i++) {
      var L = locks[i];
      var tries = L.wrongTries || [];
      h += '<div class="lk ' + (L.opened ? 'open' : 'shut') + '"><h3><span>' + esc(L.num + '. ' + L.name) + '</span><span class="pts">' + esc(L.points) + ' / ' + esc(settings.pointsPerLock || 25) + '</span></h3>';
      h += '<div class="row"><span class="k">Status</span>' + (L.opened ? '<span class="ok">✓ Opened at ' + fmt(L.openedAtMs) + '</span>' : '<span class="no">✕ Not opened</span>') + '</div>';
      if (L.opened) h += '<div class="row"><span class="k">Opened with</span><span>' + orderText(L.kind, L.entry) + '</span></div>';
      else if (L.lastSetting) h += '<div class="row"><span class="k">Last setting</span><span>' + orderText(L.kind, L.lastSetting) + '</span></div>';
      h += '<div class="row"><span class="k">Hint</span><span>' + (L.hintUsed ? 'Used (−' + esc(settings.hintCost || 5) + ')' : 'Not used') + '</span></div>';
      h += '<div class="row"><span class="k">Time on lock</span><span>' + fmt(L.activeMs) + '</span></div>';
      h += '<div class="row"><span class="k">Wrong tries</span><span>' + tries.length + '</span></div>';
      if (tries.length) {
        h += '<div class="tries">';
        for (var j = 0; j < tries.length; j++) h += '<span class="try" title="at ' + fmt(tries[j].at) + '">' + orderText(L.kind, tries[j].value) + '</span>';
        h += '</div>';
      }
      var k = key && key[L.id];
      if (k) h += '<div class="key"><b>Key:</b> ' + esc(k.answer) + (k.why ? '<br>' + esc(k.why) : '') + '</div>';
      h += '</div>';
    }
    h += '</div>';
    if (!key) h += '<p class="muted" style="margin-top:8px">The answer key appears on each lock when this page opens in SpeedGrader.</p>';
    h += '</div>';

    h += '<div class="card"><h2>Score breakdown</h2><p>' + locks.map(function(L) { return esc(L.name) + ': ' + esc(L.points); }).join(' + ') + ' = <b>' + esc(a.score) + ' / ' + esc(a.maxScore || 100) + '</b></p>' +
      '<p class="muted">' + esc(settings.pointsPerLock || 25) + ' points per lock opened, minus ' + esc(settings.hintCost || 5) + ' for a hint on that lock. Wrong tries are recorded but cost no points.</p></div>';

    document.getElementById('review-content').innerHTML = h;
  }

  var done = false;
  var previewTimer = setTimeout(function() {
    if (done || (typeof Zest !== 'undefined' && Zest.isReady && Zest.isReady())) return;
    done = true;
    document.getElementById('sample').classList.add('visible');
    render(SAMPLE, SAMPLE_KEY);
  }, 1200);

  if (typeof Zest === 'undefined') return;
  Zest.onReady(function(ctx) {
    clearTimeout(previewTimer);
    document.getElementById('sample').classList.remove('visible');
    done = true;
    if (!Zest.isReviewMode()) {
      document.getElementById('review-content').innerHTML = '<div class="card"><p>This page is only available in SpeedGrader review mode.</p></div>';
      return;
    }
    var sub = Zest.getSubmission();
    if (!sub || !sub.artifacts) {
      document.getElementById('review-content').innerHTML = '<div class="card"><p>No submission data found for this student.</p></div>';
      return;
    }
    render(sub, Zest.getAnswerKey());
  });
})();
</script>
</body>
</html>
